services:
  - type: web
    name: ia-colombia-immersive-static-site
    runtime: static
    buildCommand: npm run check
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /css/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /js/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /textX/*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /textX/*.json
        name: Content-Type
        value: application/json; charset=utf-8
      - path: /textX/seo/*.json
        name: Content-Type
        value: application/json; charset=utf-8
      - path: /llms.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /llms.txt
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /robots.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /404.html
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
    routes:
      # Redirecciones heredadas de la web vieja de ia-col.com para no perder autoridad ni enlaces compartidos.
      - type: redirect
        source: /index.html
        destination: /
      - type: redirect
        source: /index2.html
        destination: /
      - type: redirect
        source: /img/IA-Colombia.jpg
        destination: /assets/ia-colombia-logo.png
      - type: redirect
        source: /img/IA-Colombia.png
        destination: /assets/ia-colombia-logo.png
      - type: redirect
        source: /img/IA-Colombia.webp
        destination: /assets/ia-colombia-logo.png
      - type: redirect
        source: /img/icon.ico
        destination: /assets/ia-colombia-logo.png
      - type: redirect
        source: /img/*
        destination: /assets/ia-colombia-logo.png
      # Redirecciones canónicas hacia rutas bilingües indexables.
      - type: redirect
        source: /l/es/*
        destination: /es/:splat
      - type: redirect
        source: /l/en/*
        destination: /en/:splat
      - type: redirect
        source: /soluciones/*
        destination: /es/soluciones/:splat
      - type: redirect
        source: /despliegue/*
        destination: /es/despliegue/:splat
      - type: redirect
        source: /industrias/*
        destination: /es/industrias/:splat
      - type: redirect
        source: /integracion/*
        destination: /es/integracion/:splat
      - type: redirect
        source: /seguridad/*
        destination: /es/seguridad/:splat
      - type: redirect
        source: /comercial/*
        destination: /es/comercial/:splat
      - type: redirect
        source: /solutions/*
        destination: /en/solutions/:splat
      - type: redirect
        source: /deployment/*
        destination: /en/deployment/:splat
      - type: redirect
        source: /industries/*
        destination: /en/industries/:splat
      - type: redirect
        source: /integration/*
        destination: /en/integration/:splat
      - type: redirect
        source: /security/*
        destination: /en/security/:splat
      - type: redirect
        source: /business/*
        destination: /en/business/:splat
      - type: rewrite
        source: /*
        destination: /index.html
